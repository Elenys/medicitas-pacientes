<!-- Fragmentos comunes de las vistas: <head> y barra superior. -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeza(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · MediCitas'">MediCitas</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra" th:fragment="barra">
  <a class="logo" th:href="@{/pacientes}">✚ MediCitas</a>
  <span class="seccion">Administración · Gestión de pacientes</span>
</header>
<footer class="pie" th:fragment="pie">MediCitas · Sistema de gestión de citas médicas · SENA</footer>
</body>
</html>
