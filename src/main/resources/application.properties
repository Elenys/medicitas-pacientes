# MediCitas · Módulo de gestión de pacientes
spring.application.name=medicitas-pacientes
server.port=8081

# Base de datos PostgreSQL de MediCitas (entorno Docker del proyecto).
# En otros entornos se reemplazan con las variables MEDICITAS_DB_URL, MEDICITAS_DB_USUARIO y MEDICITAS_DB_CLAVE.
spring.datasource.url=${MEDICITAS_DB_URL:jdbc:postgresql://localhost:5432/medicitas}
spring.datasource.username=${MEDICITAS_DB_USUARIO:medicitas}
spring.datasource.password=${MEDICITAS_DB_CLAVE:medicitas}

# El esquema lo administra el proyecto MediCitas (migraciones de Prisma): JPA no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# MediCitas guarda las fechas en UTC (timestamp sin zona): se leen como UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
spring.mvc.format.date=iso

# La sesión (usada por los mensajes de confirmación) viaja solo en cookie, nunca en la URL.
server.servlet.session.tracking-modes=cookie
